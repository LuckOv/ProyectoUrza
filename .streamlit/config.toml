# Tema de URZA. Fija la paleta marrón y fuerza el modo claro, así los widgets
# de Streamlit (inputs, checkbox) no toman los grises oscuros del sistema.

[theme]
base = "light"
primaryColor = "#6B4A2E"
backgroundColor = "#C2A178"
secondaryBackgroundColor = "#F7EEDC"
textColor = "#2E211A"
font = "serif"

[browser]
gatherUsageStats = false
